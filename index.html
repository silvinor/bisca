<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading...</title>
  <link id="delete-1" rel="shortcut icon" href="favicon.ico">
  <link id="delete-2" rel="icon" href="favicon.gif">
  <style id="delete-3">
    @media (prefers-color-scheme: light) {
      html, body { background: #fafafa; color: #111; }
    }
    @media (prefers-color-scheme: dark) {
      html, body { background: #1f1f1f; color: #eee; }
    }
  </style>
</head>
<body>
  <div id="app" class="bg-color bg-texture"></div>
  <script type="module" src="/src/main.tsx"></script>
  <noscript id="delete-4">This app requires JavaScript</noscript>
  <script>
    (function() {
      const media = window.matchMedia('(prefers-color-scheme: dark)');
      const setTheme = (dark) => {
        window.isDarkMode = dark;
        document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
        document.body.classList.toggle('dark', dark);
        document.body.classList.toggle('light', !dark);
      };
      setTheme(media.matches);
      media.addEventListener('change', (e) => setTheme(e.matches));

      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      window.isReducedMotion = reducedMotion.matches;
      reducedMotion.addEventListener('change', (e) => {
        window.isReducedMotion = e.matches;
      });
    })();
  </script>
</body>
</html>
